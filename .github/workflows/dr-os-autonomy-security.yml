name: DrOS Autonomy Security Gate

on:
  pull_request:
    paths:
      - 'src/lib/help-desk-auto-flags.ts'
      - 'src/lib/help-desk-auto-flags.test.ts'
      - 'docs/DR_OS_AUTONOMY_SECURITY_GATES.md'
      - '.github/workflows/dr-os-autonomy-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Verify default-deny autonomy regression tests
        run: npx vitest run src/lib/help-desk-auto-flags.test.ts
      - name: Typecheck
        run: npm run typecheck
