name: DrOS Durable Replay Gate

on:
  pull_request:
    paths:
      - 'src/lib/request-handshake.ts'
      - 'src/lib/request-handshake-security.test.ts'
      - 'docs/DR_OS_DURABLE_NONCE_REVIEW.md'
      - '.github/workflows/dr-os-durable-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Replay and tenant-bound handshake tests
        run: npx vitest run src/lib/request-handshake-security.test.ts
      - name: Typecheck
        run: npm run typecheck
