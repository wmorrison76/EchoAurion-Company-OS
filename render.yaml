# EchoAurion Company OS — Super Admin control plane.
# Full checklist: DEPLOY.md
#
# Blueprint notes (Render 2025/2026):
# - Use `runtime:` (not deprecated `env:`).
# - Cron startCommands MUST be single-quoted YAML strings. Unquoted
#   `Authorization: Bearer …` breaks YAML (colon parsed as mapping).
# - Prefer Node 18+ fetch over curl (Node images may lack curl).
# - Secrets are prompted in the dashboard via sync: false — never commit values.

services:
  - type: web
    name: echoaurion-company-os
    runtime: node
    # --include=dev: Render sets NODE_ENV=production during install, which would
    # skip devDependencies (tailwindcss, postcss, typescript, etc.) that Next needs to build.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      # Set to the public https URL after first deploy (e.g. https://echoaurion-company-os.onrender.com).
      # sync: false avoids Blueprint self-ref edge cases on first create.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: KNOWLEDGE_INGEST_SECRET
        sync: false
      - key: SUPPORT_INGEST_SECRET
        sync: false

  # Optional crons — single-quoted startCommands (valid YAML). Set WEB_SERVICE_URL
  # to the web service public URL (e.g. https://echoaurion-company-os.onrender.com).
  - type: cron
    name: echoaurion-company-os-sync
    runtime: node
    schedule: "0 8 * * *"
    buildCommand: "true"
    startCommand: 'node -e ''fetch(process.env.WEB_SERVICE_URL+"/api/financial/sync",{method:"POST",headers:{Authorization:"Bearer "+process.env.CRON_SECRET}}).then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))'''
    envVars:
      - key: WEB_SERVICE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: echoaurion-company-os-briefing
    runtime: node
    schedule: "0 11 * * *"
    buildCommand: "true"
    startCommand: 'node -e ''fetch(process.env.WEB_SERVICE_URL+"/api/board-room/briefing",{method:"POST",headers:{Authorization:"Bearer "+process.env.CRON_SECRET}}).then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))'''
    envVars:
      - key: WEB_SERVICE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
