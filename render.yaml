# EchoAurion Company OS — Super Admin control plane.
# Full checklist: DEPLOY.md
#
# Blueprint notes (Render 2025/2026):
# - Use `runtime:` (not deprecated `env:`).
# - Cron jobs are NOT in this Blueprint for first deploy (see DEPLOY.md § Cron jobs).
#   Unquoted curl startCommands with `Authorization: Bearer …` break YAML parsing
#   (colon after Authorization is read as a mapping key).
# - Secrets are prompted in the dashboard via sync: false — never commit values.

services:
  - type: web
    name: echoaurion-company-os
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      # Set to the public https URL after first deploy (e.g. https://echoaurion-company-os.onrender.com).
      # sync: false avoids Blueprint self-ref edge cases on first create.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CRON_SECRET
        sync: false
