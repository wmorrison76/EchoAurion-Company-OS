# EchoAurion Company OS — Super Admin control plane.
# Full checklist: DEPLOY.md
#
# Blueprint notes (Render 2025/2026):
# - Use `runtime:` (not deprecated `env:`).
# - Cron startCommands call scripts/cron-*.mjs (clear errors, no nested quotes).
# - Prefer Node 18+ fetch over curl (Node images may lack curl).
# - Secrets are prompted in the dashboard via sync: false — never commit values.
# - WEB_SERVICE_URL is copied from the web service's RENDER_EXTERNAL_URL.
# - CRON_SECRET: set the SAME value on web + every cron (sync: false prompts
#   dashboard entry — never commit the secret). See docs/CRON_SECRET_SETUP.md.

services:
  - type: web
    name: echoaurion-company-os
    runtime: node
    # --include=dev: Render sets NODE_ENV=production during install, which would
    # skip devDependencies (tailwindcss, postcss, typescript, etc.) that Next needs to build.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      # Set to the public https URL after first deploy (e.g. https://echoaurion-company-os.onrender.com).
      # sync: false avoids Blueprint self-ref edge cases on first create.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Must match CRON_SECRET on sync / briefing / maintenance crons (same value).
      - key: CRON_SECRET
        sync: false
      - key: KNOWLEDGE_INGEST_SECRET
        sync: false
      - key: SUPPORT_INGEST_SECRET
        sync: false
      # Chef's Brain — full URL to luccca-web echo-brain proxy
      - key: ECHO_AI_URL
        sync: false
      - key: ECHO_AI_KEY
        sync: false
      # Auto-draft inbound tech questions with Knights (default true)
      - key: AUTO_KNIGHTS_ON_QUESTION
        value: "true"

  # Optional crons — scripts live in repo; buildCommand "true" keeps checkout only.
  # Each cron needs WEB_SERVICE_URL (fromService) + CRON_SECRET matching web.
  - type: cron
    name: echoaurion-company-os-sync
    runtime: node
    schedule: "0 8 * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-financial-sync.mjs
    envVars:
      - key: WEB_SERVICE_URL
        fromService:
          name: echoaurion-company-os
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Same value as web CRON_SECRET — see docs/CRON_SECRET_SETUP.md
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: echoaurion-company-os-briefing
    runtime: node
    schedule: "0 11 * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-briefing.mjs
    envVars:
      - key: WEB_SERVICE_URL
        fromService:
          name: echoaurion-company-os
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Same value as web CRON_SECRET — see docs/CRON_SECRET_SETUP.md
      - key: CRON_SECRET
        sync: false

  # Hourly: fire due SCHEDULED maintenance / major-update notices to pilots.
  - type: cron
    name: echoaurion-company-os-maintenance
    runtime: node
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-maintenance-dispatch.mjs
    envVars:
      - key: WEB_SERVICE_URL
        fromService:
          name: echoaurion-company-os
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Same value as web CRON_SECRET — see docs/CRON_SECRET_SETUP.md
      - key: CRON_SECRET
        sync: false

  # Every 5 minutes: Render/GitHub failure → SYSTEM tickets + drain ingest queue.
  # See docs/SCALE_AND_THROTTLE.md, docs/ERROR_CAPTURE_AND_SCOPE.md
  - type: cron
    name: echoaurion-company-os-ops-poll
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-ops-poll.mjs
    envVars:
      - key: WEB_SERVICE_URL
        fromService:
          name: echoaurion-company-os
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
